# Copy to settings.yaml. Budget is $0: free tier only, limited by requests, not dollars.
llm:
  free_only: true
  monthly_cap_usd: 0
  # Optional remote endpoints (e.g. InstaBox Ollama microVMs):
  # local_endpoints:
  #   rohit-2:
  #     api_base: https://<id>.instabox.tech/v1
  #     token_secret: llm_token_rohit_2
  #     timeout_s: 60
  #   rohit-3:
  #     api_base: https://<id>.instabox.tech/v1
  #     token_secret: llm_token_rohit_3
  #     timeout_s: 60
  # Model ids copied from rohit-s-modern-profile/lib/gemini.ts. `agent doctor` lists which ones the key can use;
  # remove any it reports missing.
  fast_models:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - groq/qwen/qwen3.8-27b
    - cloudflare/@cf/meta/llama-3.1-8b-instruct
    - openrouter/liquid/lfm-2.5-2.6b:free
  strong_models:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - groq/openai/gpt-oss-20b
    - groq/qwen/qwen3.8-27b
    - cloudflare/@cf/meta/llama-3.1-8b-instruct
  embedding_model: gemini-embedding-001
  embedding_scale: [0.50, 0.70]
  # Rate limits per provider/model
  limits:
    gemini-3.5-flash-lite: {rpm: 15, rpd: 500}
    gemini-3.1-flash-lite: {rpm: 15, rpd: 500}
    gemini-embedding-001: {rpm: 60, rpd: 500}
    groq/qwen/qwen3.8-27b: {rpm: 30, rpd: 1000}
    groq/openai/gpt-oss-20b: {rpm: 30, rpd: 1000}
    cloudflare/@cf/meta/llama-3.1-8b-instruct: {rpm: 30, rpd: 10000}
    openrouter/liquid/lfm-2.5-2.6b:free: {rpm: 10, rpd: 50}
  quota_headroom: 0.9
  request_timeout_s: 60
  max_retries: 2

whatsapp:
  graph_api_version: v25.0
  window_hours: 23.5

mongo:
  agent_db: job_agent
  bot_db: rohit_portfolio
  portfolio_db: portfolio

redaction:
  redact_other_urls: false
  min_name_token_len: 3

# ---- Phase 1: scoring (fit 0-100 = weighted sum; priority adds source weight and watchlist bonus)
scoring:
  weights: {semantic: 0.35, skills: 0.25, llm: 0.20, seniority: 0.10, freshness: 0.10}
  watchlist_bonus: 0.15
  rubric_per_run: 25          # Gemini rubric only for the best N new jobs per run (free-tier quota)
  rubric_min_prescore: 35
  min_digest_fit: 55          # jobs below this never reach WhatsApp
  urgent_fit: 85              # 85+ posted in the last urgent_hours: instant alert (outside quiet hours)
  urgent_hours: 6
  use_refit_weights: false    # true = use weights from `agent review refit`

notify:
  timezone: Asia/Kolkata
  digest_time: "08:00"
  quiet_start: "22:00"
  quiet_end: "07:30"
  digest_size: 10
  weekly_day: sun
  weekly_time: "19:00"

discovery:
  ats_interval_minutes: 60    # Greenhouse / Lever / Ashby boards
  jobspy_interval_minutes: 180
  min_delay_s: 2              # polite gap between requests to the same site
  max_delay_s: 5
  breaker_failures: 3         # a source failing 3 runs in a row pauses for breaker_hours and alerts once
  breaker_hours: 6

# ---- Phases 3-4: preparing and applying
apply:
  mode: live                  # off | dry_run (fill forms, never submit) | live
  min_fit: 70
  daily_cap: 50
  per_company_days: 30        # at most one application per company per 30 days
  max_consecutive_failures: 3 # then applying pauses until `agent apply resume`
  adapters: [greenhouse, lever, ashby]
  dry_runs_before_live: 0     # clean dry runs per ATS before `agent apply go-live <ats>` is allowed
  prepare_per_run: 10
  headless: true
  confirmation_timeout_s: 30

# ---- Resume: your own LaTeX file (config/resume.tex) or RenderCV built from profile.yaml
resume:
  engine: rendercv            # latex = config/resume.tex with small per-job word changes
  latex_template: resume.tex
  latex_command: ""           # path/name of tectonic, xelatex, lualatex or pdflatex; "" = first found
  headline_from_job: true     # job title first in the headline and "Seeking a <title> role at <company>."
  llm_summary: true           # Gemini rewords the summary toward the job's terms (truth-checked)
  max_pages: 1                # if tailoring makes it longer, the template is used as written
