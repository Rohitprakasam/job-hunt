<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply</title></head>
<body>
<form onsubmit="event.preventDefault(); window.__submitted = true;">
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="resume">Resume *</label><input id="resume" name="resume" type="file" required>
  <label for="colour">What is your favourite colour of the rainbow? *</label><input id="colour" name="colour" required>
  <button type="submit">Submit</button>
</form>
</body>
</html>
